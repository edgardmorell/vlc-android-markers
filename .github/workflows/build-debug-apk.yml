name: Build VLC Marker Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, pitch-shift-native]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;21.4.7075529' 'ndk;27.2.12479018'

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y gperf

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure Git identity
        run: |
          git config --global user.name "VLC Markers Build"
          git config --global user.email "vlc-markers@users.noreply.github.com"

      - name: Fetch pinned LibVLCJNI sources
        run: |
          git clone --filter=blob:none --no-checkout https://code.videolan.org/videolan/libvlcjni.git libvlcjni
          git -C libvlcjni fetch --depth=1 origin 0b8dc65efb203c86a0476bc337ddd99ecf1c0ef6
          git -C libvlcjni checkout --detach 0b8dc65efb203c86a0476bc337ddd99ecf1c0ef6
          test "$(git -C libvlcjni rev-parse HEAD)" = "0b8dc65efb203c86a0476bc337ddd99ecf1c0ef6"

      - name: Initialize VLC sources
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export VLC_LIBJNI_PATH="$GITHUB_WORKSPACE/libvlcjni"
          bash ./buildsystem/compile.sh --init

      - name: Archive LibVLCJNI source for inspection
        run: |
          zip -r libvlcjni-source.zip libvlcjni/libvlc/jni libvlcjni/libvlc/src
          zip -r libvlcjni-source.zip libvlcjni/vlc/include libvlcjni/vlc/lib/audio.c libvlcjni/vlc/lib/media_player_internal.h libvlcjni/vlc/src/audio_output

      - name: Upload LibVLCJNI source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: LibVLCJNI-source-snapshot
          path: libvlcjni-source.zip
          retention-days: 7

      - name: Compile LibVLCJNI and LibVLC from source (arm64)
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          export VLC_LIBJNI_PATH="$GITHUB_WORKSPACE/libvlcjni"
          bash ./buildsystem/compile.sh -l -a arm64-v8a

      - name: Archive custom native build outputs
        run: |
          mkdir -p native-build-snapshot
          cp -a .dbg/arm64-v8a native-build-snapshot/ 2>/dev/null || true
          cp -a libvlcjni/libvlc/jni/libs/arm64-v8a native-build-snapshot/libvlcjni-libs 2>/dev/null || true
          zip -r native-build-snapshot.zip native-build-snapshot

      - name: Upload custom native build snapshot
        uses: actions/upload-artifact@v4
        with:
          name: LibVLCJNI-arm64-native-build
          path: native-build-snapshot.zip
          retention-days: 7

      - name: Build dev APK with source-built LibVLCJNI
        run: gradle --no-daemon --stacktrace assembleDev

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Marker-dev-apk
          path: application/app/build/outputs/apk/dev/*.apk
          if-no-files-found: error
          retention-days: 14
