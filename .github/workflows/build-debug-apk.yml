name: Build VLC Marker Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, pitch-shift-native]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;21.4.7075529'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure Git identity
        run: |
          git config --global user.name "VLC Markers Build"
          git config --global user.email "vlc-markers@users.noreply.github.com"

      - name: Initialize VLC sources
        run: |
          export ANDROID_SDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/21.4.7075529"
          bash ./buildsystem/compile.sh --init

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Marker-debug-apk
          path: application/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
